name: GamingClub - Android build verification

on:
  push:
    branches:
      - ci/build-check-android-20261118
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android debug APK and local JVM tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version
      - name: Install API 35 and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android debug APK
        run: gradle -p mobile/GamingClub.Android :app:assembleDebug --stacktrace
      - name: Run Android JVM tests
        run: gradle -p mobile/GamingClub.Android :app:testDebugUnitTest --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gamingclub-android-debug-apk
          path: mobile/GamingClub.Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamingclub-android-test-reports
          path: |
            mobile/GamingClub.Android/app/build/test-results/testDebugUnitTest/
            mobile/GamingClub.Android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
